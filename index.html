<style>
  :root{
    --cream:#F3EBDA;
    --paper:#FBF6EA;
    --espresso:#2C1B12;
    --espresso-soft:#5B4636;
    --amber:#B8722C;
    --amber-deep:#8F5A22;
    --sage:#6B7F5B;
    --rust:#AD4B34;
    --line: rgba(44,27,18,0.14);
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Work Sans', -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', 'Courier New', monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body{
    font-family: var(--font-body);
    background: var(--cream);
    background-image: radial-gradient(circle at 1px 1px, rgba(44,27,18,0.06) 1px, transparent 0);
    background-size: 18px 18px;
    color: var(--espresso);
    min-height: 100vh;
    padding: 28px 18px 60px;
  }
  .wrap{ max-width: 860px; margin: 0 auto; }

  .hero{ text-align:center; margin-bottom: 28px; }
  .hero .eyebrow{
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--amber-deep);
    margin-bottom: 6px;
  }
  .hero h1{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(28px, 5vw, 42px);
    margin: 0 0 6px;
  }
  .hero p{ margin:0; color: var(--espresso-soft); font-size: 14px; }

  .summary-row{
    display:flex; gap:12px; justify-content:center; flex-wrap:wrap;
    margin: 22px 0 30px;
  }
  .summary-card{
    background: var(--espresso); color: var(--paper);
    border-radius: 10px; padding: 12px 20px; min-width: 130px; text-align:center;
  }
  .summary-card .val{ font-family: var(--font-mono); font-size: 20px; font-weight: 600; }
  .summary-card .lbl{
    font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase;
    opacity: 0.75; margin-top: 2px;
  }

  form.add-form{
    background: var(--paper); border: 1px solid var(--line); border-radius: 14px;
    padding: 18px; display:grid; grid-template-columns: 2fr 1fr 1fr auto;
    gap: 10px; align-items:end; margin-bottom: 30px;
    box-shadow: 0 1px 0 rgba(44,27,18,0.05);
  }
  .field{ display:flex; flex-direction:column; gap: 5px; }
  .field label{
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--espresso-soft);
  }
  .field input{
    font-family: var(--font-body); font-size: 14px; padding: 9px 10px;
    border: 1px solid var(--line); border-radius: 7px; background: #fff; color: var(--espresso);
  }
  .field input:focus{ outline: 2px solid var(--amber); outline-offset: 1px; }
  .add-form button{
    background: var(--espresso); color: var(--paper); border: none; border-radius: 7px;
    padding: 10px 18px; font-family: var(--font-body); font-weight: 600; font-size: 13px;
    cursor: pointer; height: 38px;
  }
  .add-form button:hover{ background: var(--amber-deep); }

  .week-panel{
    background: var(--paper); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px 18px; margin-bottom: 30px;
  }
  .week-panel h2{
    font-family: var(--font-display); font-size: 16px; font-weight: 600;
    margin: 0 0 12px; color: var(--espresso);
  }
  .week-list{ display:flex; gap: 10px; overflow-x:auto; padding-bottom: 4px; }
  .week-card{
    flex: 0 0 auto; min-width: 150px; background: var(--cream); border-radius: 10px;
    padding: 10px 14px; border: 1px solid var(--line);
  }
  .week-card .range{
    font-family: var(--font-body); font-size: 10.5px; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--espresso-soft); margin-bottom: 4px;
  }
  .week-card .amount{ font-family: var(--font-mono); font-size: 17px; font-weight: 600; color: var(--espresso); }
  .week-card .count{ font-size: 11px; color: var(--espresso-soft); margin-top: 2px; }

  .day-group{ margin-bottom: 26px; }
  .day-header{
    display:flex; align-items:baseline; gap: 10px; margin-bottom: 12px;
    padding-bottom: 6px; border-bottom: 1px solid var(--line);
  }
  .day-header .day-label{
    font-family: var(--font-display); font-size: 16px; font-weight: 600; color: var(--espresso);
    text-transform: capitalize;
  }
  .day-header .day-total{
    font-family: var(--font-mono); font-size: 12px; color: var(--espresso-soft); margin-left: auto;
  }
  .ticket-date{
    font-family: var(--font-body); font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--espresso-soft); opacity: 0.7; margin-top: 10px;
  }

  .tickets{ display:grid; grid-template-columns: repeat(auto-fill, minmax(240px,1fr)); gap: 18px; }

  .ticket{
    position:relative; background: var(--paper); border-radius: 4px;
    padding: 18px 16px 16px; font-family: var(--font-mono);
    box-shadow: 0 2px 6px rgba(44,27,18,0.10); border-top: 3px dashed var(--line);
  }
  .ticket::before{
    content:""; position:absolute; top:-7px; left:0; right:0; height:14px;
    background-image: radial-gradient(circle 7px at 12px 0, transparent 7px, var(--cream) 7.5px);
    background-repeat: repeat-x; background-size: 24px 14px; background-position: -4px -7px;
  }
  .ticket.pending{ opacity: 0.92; }
  .ticket.bought{ border-top-color: var(--sage); }

  .ticket-name{
    font-family: var(--font-display); font-size: 18px; font-weight: 600;
    color: var(--espresso); margin-bottom: 10px; line-height:1.2;
  }
  .ticket-row{
    display:flex; justify-content:space-between; font-size: 12px;
    color: var(--espresso-soft); padding: 4px 0; border-bottom: 1px dotted var(--line);
  }
  .ticket-row span:last-child{ color: var(--espresso); font-weight: 600; }

  .status-toggle{ margin-top: 12px; display:flex; gap:8px; }
  .status-toggle button{
    flex:1; font-family: var(--font-body); font-size: 11.5px; font-weight: 600;
    padding: 7px 6px; border-radius: 6px; border: 1px solid var(--line);
    background: #fff; cursor:pointer; color: var(--espresso-soft);
  }
  .status-toggle button.active-bought{ background: var(--sage); border-color: var(--sage); color: #fff; }
  .status-toggle button.active-pending{ background: var(--rust); border-color: var(--rust); color: #fff; }

  .qty-field{ margin-top: 12px; }
  .qty-field label{
    font-family: var(--font-body); font-size: 10.5px; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--espresso-soft); display:block; margin-bottom: 5px;
  }
  .qty-field input{
    width:100%; font-family: var(--font-mono); font-size: 18px; font-weight: 600; padding: 11px 14px 11px 10px;
    border: 1.5px solid var(--line); border-radius: 8px; background:#fff; color: var(--espresso);
  }
  .qty-field input:focus{ outline: 2px solid var(--amber); outline-offset: 1px; }
  .qty-field input[type=number]::-webkit-inner-spin-button,
  .qty-field input[type=number]::-webkit-outer-spin-button{
    -webkit-appearance: auto;
    transform: scale(1.8);
    transform-origin: right center;
    margin-left: 6px;
    cursor: pointer;
  }

  .del-btn{
    position:absolute; top: 10px; right: 10px; background: none; border: none;
    color: var(--line); font-size: 16px; cursor: pointer; line-height:1; font-family: var(--font-body);
  }
  .del-btn:hover{ color: var(--rust); }

  .empty-state{ text-align:center; padding: 50px 20px; color: var(--espresso-soft); }
  .empty-state .icon{ font-size: 30px; margin-bottom: 8px; }

  .status-msg{
    text-align:center; padding: 60px 20px; color: var(--espresso-soft);
    font-family: var(--font-mono); font-size: 13px;
  }
  .error-msg{ color: var(--rust); font-size: 12px; margin-bottom: 14px; text-align:center; }

  .export-btn{
    background: var(--sage); color: #fff; border: none; border-radius: 8px;
    padding: 11px 22px; font-family: var(--font-body); font-weight: 600; font-size: 13px;
    cursor: pointer; box-shadow: 0 2px 5px rgba(44,27,18,0.15);
  }
  .export-btn:hover{ background: var(--sage-deep, #4E5F43); }
  .export-btn:disabled{ opacity: 0.55; cursor: not-allowed; }

  @media (max-width: 560px){
    form.add-form{ grid-template-columns: 1fr 1fr; }
    form.add-form .field:first-child{ grid-column: 1 / -1; }
    .add-form button{ grid-column: 1/-1; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <div class="eyebrow">Cafetería · Cuaderno de compras</div>
      <h1>Mi Lista de Compras</h1>
      <p>Registra qué necesitas, cuánto vas a comprar y cuánto te costó.</p>
    </div>

    <div class="summary-row" id="summary-row"></div>

    <div style="text-align:center; margin-bottom:22px;">
      <button id="export-btn" class="export-btn">⬇ Exportar a Excel</button>
    </div>

    <form class="add-form" id="add-form">
      <div class="field">
        <label for="nombre">Producto</label>
        <input id="nombre" type="text" placeholder="Ej: Granos de café" autocomplete="off">
      </div>
      <div class="field">
        <label for="cantidad">Cantidad</label>
        <input id="cantidad" type="text" placeholder="Ej: 2 kg" autocomplete="off">
      </div>
      <div class="field">
        <label for="costo">Costo unitario (S/)</label>
        <input id="costo" type="number" step="0.01" placeholder="0.00">
      </div>
      <button type="submit">Añadir</button>
    </form>

    <div class="week-panel" id="week-panel" style="display:none;">
      <h2>Resumen semanal</h2>
      <div class="week-list" id="week-list"></div>
    </div>

    <div id="error-container"></div>
    <div id="tickets-container">
      <div class="status-msg">Preparando tu lista de compras...</div>
    </div>
  </div>

<script>
  const STORAGE_KEY = "cafeteria-lista-compras";
  let items = [];
  let loaded = false;

  function fmtMoney(n){
    const num = Number(n);
    if (Number.isNaN(num) || n === "" || n === null || n === undefined) return "—";
    return "S/ " + num.toFixed(2);
  }

  // Extrae el primer número de un texto como "2 kg" -> 2
  function parseNumeric(str){
    if (str === undefined || str === null) return null;
    const m = String(str).match(/-?\d+(\.\d+)?/);
    return m ? parseFloat(m[0]) : null;
  }

  // Si la cantidad menciona "kg", el paso de las flechas sube de 0.5 en 0.5; si no, de 1 en 1
  function stepFor(item){
    return /kg/i.test(item.cantidad || "") ? "0.5" : "1";
  }

  // Costo total real de un producto ya comprado = costo unitario x cantidad comprada.
  // Si aún no se indicó cuántos compró, se asume 1 unidad por defecto.
  function itemTotalCost(item){
    if (!item.comprado) return 0;
    const unitario = Number(item.costo) || 0;
    let cant = item.cantidadComprada !== undefined && item.cantidadComprada !== null && item.cantidadComprada !== ""
      ? Number(item.cantidadComprada)
      : null;
    if (cant === null || Number.isNaN(cant)) cant = 1;
    return unitario * cant;
  }

  function escapeHtml(str){
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function todayStr(){
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }

  function dayLabel(dateStr){
    const today = todayStr();
    const d = new Date(dateStr + "T00:00:00");
    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    const yStr = yesterday.getFullYear() + "-" + String(yesterday.getMonth()+1).padStart(2,"0") + "-" + String(yesterday.getDate()).padStart(2,"0");
    if (dateStr === today) return "Hoy";
    if (dateStr === yStr) return "Ayer";
    return d.toLocaleDateString("es-PE", { weekday: "long", day: "numeric", month: "long" });
  }

  function mondayOf(dateStr){
    const d = new Date(dateStr + "T00:00:00");
    const day = d.getDay();
    const diff = (day === 0 ? -6 : 1 - day);
    d.setDate(d.getDate() + diff);
    return d;
  }

  function weekKeyOf(dateStr){
    const m = mondayOf(dateStr);
    return m.getFullYear() + "-" + String(m.getMonth()+1).padStart(2,"0") + "-" + String(m.getDate()).padStart(2,"0");
  }

  function weekRangeLabel(weekKey){
    const start = new Date(weekKey + "T00:00:00");
    const end = new Date(start);
    end.setDate(start.getDate() + 6);
    const startStr = start.toLocaleDateString("es-PE", { day: "numeric", month: "short" });
    const endStr = end.toLocaleDateString("es-PE", { day: "numeric", month: "short" });
    return startStr + " – " + endStr;
  }

  function loadItems(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      items = raw ? JSON.parse(raw) : [];
    }catch(e){
      items = [];
    }
    loaded = true;
    render();
  }

  function persist(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      showError("");
    }catch(e){
      showError("No se pudo guardar. Intenta de nuevo.");
    }
  }

  function showError(msg){
    const c = document.getElementById("error-container");
    c.innerHTML = msg ? '<div class="error-msg">' + escapeHtml(msg) + '</div>' : "";
  }

  function addItem(nombre, cantidad, costo){
    const cantidadSugerida = parseNumeric(cantidad);
    items.unshift({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
      nombre, cantidad, costo,
      comprado: false,
      cantidadComprada: cantidadSugerida !== null ? cantidadSugerida : "",
      fecha: todayStr()
    });
    persist();
    render();
  }

  function updateItem(id, patch){
    const it = items.find(i => i.id === id);
    if (it) Object.assign(it, patch);
    persist();
    render();
  }

  function deleteItem(id){
    items = items.filter(i => i.id !== id);
    persist();
    render();
  }

  function renderSummary(){
    const totalGastado = items.filter(i => i.comprado).reduce((s,i) => s + itemTotalCost(i), 0);
    const pendientes = items.filter(i => !i.comprado).length;
    const comprados = items.filter(i => i.comprado).length;
    document.getElementById("summary-row").innerHTML = `
      <div class="summary-card"><div class="val">${items.length}</div><div class="lbl">Productos</div></div>
      <div class="summary-card"><div class="val">${pendientes}</div><div class="lbl">Por comprar</div></div>
      <div class="summary-card"><div class="val">${comprados}</div><div class="lbl">Comprados</div></div>
      <div class="summary-card"><div class="val">${fmtMoney(totalGastado)}</div><div class="lbl">Gastado</div></div>
    `;
  }

  function ticketHtml(item){
    return `
      <div class="ticket ${item.comprado ? 'bought' : 'pending'}" data-id="${item.id}">
        <button class="del-btn" data-action="delete" data-id="${item.id}" title="Eliminar" aria-label="Eliminar producto">✕</button>
        <div class="ticket-name">${escapeHtml(item.nombre)}</div>
        <div class="ticket-row"><span>Cantidad planeada</span><span>${item.cantidad ? escapeHtml(item.cantidad) : "—"}</span></div>
        <div class="ticket-row"><span>Costo unitario</span><span>${item.costo !== "" ? fmtMoney(item.costo) : "—"}</span></div>

        <div class="qty-field">
          <label for="cant-comprada-${item.id}">${item.comprado ? "¿Cuántos compraste?" : "¿Cuántos vas a comprar?"}</label>
          <input id="cant-comprada-${item.id}" data-action="cantidadComprada" data-id="${item.id}" type="number" step="${stepFor(item)}" placeholder="Ej: 2" value="${item.cantidadComprada !== undefined && item.cantidadComprada !== null ? item.cantidadComprada : ''}">
        </div>

        ${item.comprado ? `<div class="ticket-row"><span>Costo total</span><span>${fmtMoney(itemTotalCost(item))}</span></div>` : ""}

        <div class="status-toggle">
          <button data-action="bought" data-id="${item.id}" class="${item.comprado ? 'active-bought' : ''}">Comprado</button>
          <button data-action="pending" data-id="${item.id}" class="${!item.comprado ? 'active-pending' : ''}">Pendiente</button>
        </div>
      </div>
    `;
  }

  function renderTickets(){
    const container = document.getElementById("tickets-container");
    if (!loaded){
      container.innerHTML = '<div class="status-msg">Preparando tu lista de compras...</div>';
      return;
    }
    if (items.length === 0){
      container.innerHTML = '<div class="empty-state"><div class="icon">☕</div><div>Aún no has agregado productos. Empieza arriba.</div></div>';
      return;
    }

    // group by fecha (fallback to "sin-fecha" for legacy items without one)
    const groups = {};
    items.forEach(item => {
      const key = item.fecha || "sin-fecha";
      if (!groups[key]) groups[key] = [];
      groups[key].push(item);
    });
    const dateKeys = Object.keys(groups).sort((a,b) => b.localeCompare(a));

    container.innerHTML = dateKeys.map(dateKey => {
      const dayItems = groups[dateKey];
      const dayTotal = dayItems.filter(i => i.comprado).reduce((s,i) => s + itemTotalCost(i), 0);
      const label = dateKey === "sin-fecha" ? "Sin fecha" : dayLabel(dateKey);
      return `
        <div class="day-group">
          <div class="day-header">
            <span class="day-label">${label}</span>
            <span class="day-total">${dayTotal > 0 ? "Gastado: " + fmtMoney(dayTotal) : ""}</span>
          </div>
          <div class="tickets">${dayItems.map(ticketHtml).join("")}</div>
        </div>
      `;
    }).join("");
  }

  function renderWeekPanel(){
    const panel = document.getElementById("week-panel");
    const list = document.getElementById("week-list");
    const withDates = items.filter(i => i.fecha);
    if (withDates.length === 0){
      panel.style.display = "none";
      return;
    }
    const weeks = {};
    withDates.forEach(item => {
      const wk = weekKeyOf(item.fecha);
      if (!weeks[wk]) weeks[wk] = { total: 0, count: 0 };
      if (item.comprado){
        weeks[wk].total += itemTotalCost(item);
        weeks[wk].count += 1;
      }
    });
    const weekKeys = Object.keys(weeks).sort((a,b) => b.localeCompare(a));
    if (weekKeys.every(k => weeks[k].count === 0)){
      panel.style.display = "none";
      return;
    }
    panel.style.display = "";
    list.innerHTML = weekKeys.map(wk => `
      <div class="week-card">
        <div class="range">${weekRangeLabel(wk)}</div>
        <div class="amount">${fmtMoney(weeks[wk].total)}</div>
        <div class="count">${weeks[wk].count} compra${weeks[wk].count === 1 ? "" : "s"}</div>
      </div>
    `).join("");
  }

  function render(){
    renderSummary();
    renderWeekPanel();
    renderTickets();
  }

  document.getElementById("add-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const nombre = document.getElementById("nombre").value.trim();
    const cantidad = document.getElementById("cantidad").value.trim();
    const costo = document.getElementById("costo").value.trim();
    if (!nombre) return;
    addItem(nombre, cantidad, costo);
    document.getElementById("nombre").value = "";
    document.getElementById("cantidad").value = "";
    document.getElementById("costo").value = "";
    document.getElementById("nombre").focus();
  });

  document.getElementById("tickets-container").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const id = btn.dataset.id;
    const action = btn.dataset.action;
    if (action === "delete") deleteItem(id);
    if (action === "bought"){
      const cantInput = document.getElementById("cant-comprada-" + id);
      const val = cantInput ? parseFloat(cantInput.value) : NaN;
      if (!val || val <= 0){
        if (cantInput){
          cantInput.focus();
          cantInput.style.borderColor = "var(--rust)";
          setTimeout(() => { cantInput.style.borderColor = ""; }, 1200);
        }
        return;
      }
      updateItem(id, { comprado: true, cantidadComprada: val });
    }
    if (action === "pending") updateItem(id, { comprado: false });
  });

  document.getElementById("tickets-container").addEventListener("input", (e) => {
    const cantEl = e.target.closest("input[data-action='cantidadComprada']");
    if (cantEl){
      const it = items.find(i => i.id === cantEl.dataset.id);
      if (it) it.cantidadComprada = cantEl.value;
      persist();
    }
  });

  document.getElementById("export-btn").addEventListener("click", () => exportToExcel());

  function renderChartImage(type, labels, data, title, color){
    return new Promise(resolve => {
      const canvas = document.createElement("canvas");
      canvas.width = 700; canvas.height = 460;
      canvas.style.position = "fixed";
      canvas.style.left = "-9999px";
      document.body.appendChild(canvas);
      const isPie = type === "pie";
      const chart = new Chart(canvas.getContext("2d"), {
        type,
        data: {
          labels,
          datasets: [{
            label: title,
            data,
            backgroundColor: Array.isArray(color) ? color : color,
            borderColor: "#FBF6EA",
            borderWidth: isPie ? 2 : 0
          }]
        },
        options: {
          responsive: false,
          animation: false,
          plugins: {
            title: { display: true, text: title, font: { size: 16 }, color: "#2C1B12" },
            legend: { display: isPie, position: "bottom", labels: { color: "#2C1B12", font: { size: 11 } } },
            tooltip: { enabled: false },
            datalabels: undefined
          },
          scales: isPie ? {} : {
            y: { beginAtZero: true, ticks: { color: "#5B4636" }, grid: { color: "#E5DAC8" } },
            x: { ticks: { color: "#5B4636" }, grid: { display: false } }
          }
        }
      });
      setTimeout(() => {
        const url = canvas.toDataURL("image/png");
        chart.destroy();
        document.body.removeChild(canvas);
        resolve(url);
      }, 120);
    });
  }

  async function exportToExcel(){
    const btn = document.getElementById("export-btn");
    const compras = items.filter(i => i.comprado);
    if (compras.length === 0){
      showError("Aún no tienes ninguna compra registrada para exportar.");
      return;
    }
    showError("");
    btn.disabled = true;
    const originalText = btn.textContent;
    btn.textContent = "Generando...";

    try{
      const ESPRESSO = "FF2C1B12", CREAM = "FFF3EBDA", PAPER = "FFFBF6EA",
            AMBER = "FFB8722C", SAGE = "FF6B7F5B", SAGE_DEEP = "FF4E5F43",
            WHITE = "FFFFFFFF";

      const wb = new ExcelJS.Workbook();
      wb.creator = "Mi Lista de Compras — Cafetería";
      wb.created = new Date();

      const headerFill = { type: "pattern", pattern: "solid", fgColor: { argb: ESPRESSO } };
      const headerFont = { name: "Arial", bold: true, color: { argb: WHITE }, size: 11 };
      const titleFont = { name: "Arial", bold: true, color: { argb: ESPRESSO.replace("FF","FF") }, size: 16 };
      const bandFill = { type: "pattern", pattern: "solid", fgColor: { argb: PAPER } };
      const totalFill = { type: "pattern", pattern: "solid", fgColor: { argb: CREAM } };
      const thinBorder = { style: "thin", color: { argb: "FFD8CBB8" } };
      const box = { top: thinBorder, bottom: thinBorder, left: thinBorder, right: thinBorder };
      const MONEY = 'S/ #,##0.00';

      function styleHeaderRow(row){
        row.eachCell(cell => {
          cell.fill = headerFill; cell.font = headerFont;
          cell.alignment = { horizontal: "center", vertical: "middle" };
          cell.border = box;
        });
      }
      function styleDataRow(row, idx){
        row.eachCell(cell => {
          cell.fill = idx % 2 === 0 ? bandFill : { type: "pattern", pattern: "solid", fgColor: { argb: WHITE } };
          cell.font = { name: "Arial", size: 10, color: { argb: ESPRESSO } };
          cell.border = box;
        });
      }

      // ---------- Sheet 1: Historial de Compras ----------
      const ws1 = wb.addWorksheet("Historial de Compras", { views: [{ showGridLines: false }] });
      ws1.mergeCells("A1:F1");
      ws1.getCell("A1").value = "Historial de Compras";
      ws1.getCell("A1").font = { name: "Arial", bold: true, size: 16, color: { argb: ESPRESSO } };
      ws1.mergeCells("A2:F2");
      ws1.getCell("A2").value = "Cafetería — cada producto marcado como comprado";
      ws1.getCell("A2").font = { name: "Arial", italic: true, size: 10, color: { argb: "FF5B4636" } };

      const headerRow1 = ws1.getRow(4);
      headerRow1.values = ["Fecha", "Producto", "Cantidad Comprada", "Costo Unitario", "Costo Total", "Semana (lunes)"];
      styleHeaderRow(headerRow1);

      const comprasOrdenadas = [...compras].sort((a,b) => (a.fecha || "").localeCompare(b.fecha || ""));
      comprasOrdenadas.forEach((item, idx) => {
        const row = ws1.getRow(5 + idx);
        const total = itemTotalCost(item);
        row.values = [
          item.fecha ? new Date(item.fecha + "T00:00:00") : null,
          item.nombre,
          item.cantidadComprada || "",
          Number(item.costo) || 0,
          total,
          item.fecha ? mondayOf(item.fecha) : null
        ];
        row.getCell(1).numFmt = "dd/mm/yyyy";
        row.getCell(4).numFmt = MONEY;
        row.getCell(5).numFmt = MONEY;
        row.getCell(6).numFmt = "dd/mm/yyyy";
        styleDataRow(row, idx);
      });

      const lastRow1 = 5 + comprasOrdenadas.length;
      const totalRow1 = ws1.getRow(lastRow1);
      totalRow1.getCell(2).value = "Total";
      totalRow1.getCell(2).font = { name: "Arial", bold: true, color: { argb: ESPRESSO } };
      totalRow1.getCell(5).value = { formula: `SUM(E5:E${lastRow1 - 1})` };
      totalRow1.getCell(5).numFmt = MONEY;
      totalRow1.getCell(5).font = { name: "Arial", bold: true, color: { argb: ESPRESSO } };
      totalRow1.eachCell({ includeEmpty: true }, cell => { cell.fill = totalFill; cell.border = box; });

      ws1.columns = [
        { width: 12 }, { width: 26 }, { width: 18 }, { width: 15 }, { width: 14 }, { width: 15 }
      ];
      ws1.views = [{ state: "frozen", ySplit: 4 }];

      // ---------- Sheet 2: Resumen Semanal ----------
      const ws2 = wb.addWorksheet("Resumen Semanal", { views: [{ showGridLines: false }] });
      ws2.mergeCells("A1:C1");
      ws2.getCell("A1").value = "Resumen Semanal de Gastos";
      ws2.getCell("A1").font = { name: "Arial", bold: true, size: 16, color: { argb: ESPRESSO } };
      ws2.mergeCells("A2:C2");
      ws2.getCell("A2").value = "Gasto total y compras por semana (lunes a domingo)";
      ws2.getCell("A2").font = { name: "Arial", italic: true, size: 10, color: { argb: "FF5B4636" } };

      const weekMap = {};
      compras.forEach(item => {
        if (!item.fecha) return;
        const wk = weekKeyOf(item.fecha);
        if (!weekMap[wk]) weekMap[wk] = { total: 0, count: 0 };
        weekMap[wk].total += itemTotalCost(item);
        weekMap[wk].count += 1;
      });
      const weekKeys = Object.keys(weekMap).sort();

      const headerRow2 = ws2.getRow(4);
      headerRow2.values = ["Semana (lunes)", "Gasto Total", "N° Compras"];
      styleHeaderRow(headerRow2);
      weekKeys.forEach((wk, idx) => {
        const row = ws2.getRow(5 + idx);
        row.values = [new Date(wk + "T00:00:00"), weekMap[wk].total, weekMap[wk].count];
        row.getCell(1).numFmt = "dd/mm/yyyy";
        row.getCell(2).numFmt = MONEY;
        styleDataRow(row, idx);
      });
      const lastRow2 = 5 + weekKeys.length;
      const totalRow2 = ws2.getRow(lastRow2);
      totalRow2.getCell(1).value = "Total";
      totalRow2.getCell(1).font = { name: "Arial", bold: true, color: { argb: ESPRESSO } };
      totalRow2.getCell(2).value = { formula: `SUM(B5:B${lastRow2 - 1})` };
      totalRow2.getCell(2).numFmt = MONEY;
      totalRow2.getCell(2).font = { name: "Arial", bold: true, color: { argb: ESPRESSO } };
      totalRow2.eachCell({ includeEmpty: true }, cell => { cell.fill = totalFill; cell.border = box; });
      ws2.columns = [{ width: 16 }, { width: 15 }, { width: 13 }];

      if (weekKeys.length > 0){
        const weekLabels = weekKeys.map(wk => new Date(wk + "T00:00:00").toLocaleDateString("es-PE", { day: "numeric", month: "short" }));
        const weekData = weekKeys.map(wk => Math.round(weekMap[wk].total * 100) / 100);
        const imgUrl = await renderChartImage("bar", weekLabels, weekData, "Gasto por Semana (S/)", "#B8722C");
        const imgId = wb.addImage({ base64: imgUrl, extension: "png" });
        ws2.addImage(imgId, { tl: { col: 4, row: 3 }, ext: { width: 480, height: 300 } });
      }

      // ---------- Sheet 3: Detalle por Producto ----------
      const ws3 = wb.addWorksheet("Detalle por Producto", { views: [{ showGridLines: false }] });
      ws3.mergeCells("A1:D1");
      ws3.getCell("A1").value = "Gasto por Producto";
      ws3.getCell("A1").font = { name: "Arial", bold: true, size: 16, color: { argb: ESPRESSO } };
      ws3.mergeCells("A2:D2");
      ws3.getCell("A2").value = "Cuánto has gastado en cada producto y cuántas veces lo compraste";
      ws3.getCell("A2").font = { name: "Arial", italic: true, size: 10, color: { argb: "FF5B4636" } };

      const prodMap = {};
      compras.forEach(item => {
        if (!prodMap[item.nombre]) prodMap[item.nombre] = { total: 0, veces: 0 };
        prodMap[item.nombre].total += itemTotalCost(item);
        prodMap[item.nombre].veces += 1;
      });
      const prodNames = Object.keys(prodMap).sort((a,b) => prodMap[b].total - prodMap[a].total);
      const granTotal = prodNames.reduce((s,n) => s + prodMap[n].total, 0);

      const headerRow3 = ws3.getRow(4);
      headerRow3.values = ["Producto", "Veces Comprado", "Gasto Total", "% del Gasto"];
      styleHeaderRow(headerRow3);
      prodNames.forEach((name, idx) => {
        const row = ws3.getRow(5 + idx);
        const pct = granTotal > 0 ? prodMap[name].total / granTotal : 0;
        row.values = [name, prodMap[name].veces, prodMap[name].total, pct];
        row.getCell(3).numFmt = MONEY;
        row.getCell(4).numFmt = "0.0%";
        styleDataRow(row, idx);
      });
      const lastRow3 = 5 + prodNames.length;
      const totalRow3 = ws3.getRow(lastRow3);
      totalRow3.getCell(1).value = "Total";
      totalRow3.getCell(1).font = { name: "Arial", bold: true, color: { argb: ESPRESSO } };
      totalRow3.getCell(3).value = { formula: `SUM(C5:C${lastRow3 - 1})` };
      totalRow3.getCell(3).numFmt = MONEY;
      totalRow3.getCell(3).font = { name: "Arial", bold: true, color: { argb: ESPRESSO } };
      totalRow3.getCell(4).value = { formula: `SUM(D5:D${lastRow3 - 1})` };
      totalRow3.getCell(4).numFmt = "0.0%";
      totalRow3.getCell(4).font = { name: "Arial", bold: true, color: { argb: ESPRESSO } };
      totalRow3.eachCell({ includeEmpty: true }, cell => { cell.fill = totalFill; cell.border = box; });
      ws3.columns = [{ width: 26 }, { width: 16 }, { width: 14 }, { width: 13 }];

      if (prodNames.length > 0){
        const pieColors = ["#B8722C", "#6B7F5B", "#AD4B34", "#8F5A22", "#4E5F43", "#C9A063", "#7A8B6F", "#9C5B3E"];
        const pieData = prodNames.map(n => Math.round(prodMap[n].total * 100) / 100);
        const pieLabels = prodNames.map(n => {
          const pct = granTotal > 0 ? (prodMap[n].total / granTotal) * 100 : 0;
          return `${n} (${pct.toFixed(1)}%)`;
        });
        const imgUrl2 = await renderChartImage("pie", pieLabels, pieData, "% del Gasto por Producto", pieColors);
        const imgId2 = wb.addImage({ base64: imgUrl2, extension: "png" });
        ws3.addImage(imgId2, { tl: { col: 5, row: 3 }, ext: { width: 420, height: 340 } });
      }

      const buffer = await wb.xlsx.writeBuffer();
      const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "historial-compras-cafeteria-" + todayStr() + ".xlsx";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }catch(err){
      showError("No se pudo generar el Excel. Intenta de nuevo.");
    }finally{
      btn.disabled = false;
      btn.textContent = originalText;
    }
  }

  loadItems();
</script>
</body>
</html>
